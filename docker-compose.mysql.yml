services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ghcp_proxy}
      MYSQL_USER: ${MYSQL_USER:-ghcp_proxy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ghcp_proxy_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ghcp_root_local}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent

volumes:
  mysql-data:
